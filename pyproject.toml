[project]
name = "musr"
version = "0.1.0"
description = "MuSR dataset generation and evaluation codebase, with CS422 benchmark extensions."
readme = "README.md"
requires-python = ">=3.9,<3.13"
dependencies = [
  "aiohttp>=3.10,<4",
  "jsonlines>=4,<5",
  "numpy>=1.26,<3",
  "PyYAML>=6,<7",
  "redis>=5,<6",
  "requests>=2.32,<3",
  "tqdm>=4.66,<5",
  "typing_extensions>=4.10,<5",
  "together>=1.4,<2",
  "transformers>=4.45,<5",
  "tokenizers>=0.20,<1",
  "huggingface-hub>=0.25,<1",
  "safetensors>=0.4,<1",
  "accelerate>=0.34,<1",
  "torch>=2.2",
]

[tool.uv]
package = false
